<svg lang="en" xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520"><rect width="1080" height="520" fill="#f0f4f7"/><rect width="1080" height="60" fill="white"/><g font-family="sans-serif"><text x="24" y="39" font-size="23" fill="#233848">Speaker notes</text><text x="400" y="38" font-size="16" fill="#586a77">Font size | Speech only | Dark mode | Timer</text><text x="24" y="110" font-size="18" fill="#164d69">01 Conclusion</text><text x="24" y="152" font-size="18" fill="#586a77">02 Evidence</text><rect x="250" y="86" width="800" height="360" fill="white"/><text x="280" y="130" font-size="25" fill="#233848">A clear conclusion, then evidence</text><rect x="280" y="152" width="730" height="45" fill="#f5f0e3"/><text x="296" y="181" font-size="16" fill="#775d29">Delivery cue - do not read aloud</text><text x="280" y="242" font-size="22" fill="#164d69">Readable spoken text with comfortable spacing.</text><rect x="278" y="262" width="520" height="40" fill="#e9f4ef"/><text x="284" y="290" font-size="22" font-weight="bold" fill="#0e6356">A key judgment receives semantic emphasis.</text><rect x="280" y="326" width="730" height="48" fill="#f0f4f7" stroke="#d6e0e7"/><text x="296" y="357" font-size="17" fill="#164d69">Optional depth - immediately after its relevant block</text><text x="280" y="413" font-size="22" fill="#164d69">Then continue with the next point.</text><text x="24" y="490" font-size="15" fill="#586a77">Illustrative layout, not a browser screenshot. Follow the link for actual HTML source.</text></g></svg>