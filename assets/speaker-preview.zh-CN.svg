<svg lang="zh-CN" xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520"><rect width="1080" height="520" fill="#f0f4f7"/><rect width="1080" height="60" fill="white"/><g font-family="sans-serif"><text x="24" y="39" font-size="23" fill="#233848">演讲者讲稿</text><text x="400" y="38" font-size="16" fill="#586a77">字号调节 | 只看口播 | 深色模式 | 计时</text><text x="24" y="110" font-size="18" fill="#164d69">01 本次判断</text><text x="24" y="152" font-size="18" fill="#586a77">02 证据与下一步</text><rect x="250" y="86" width="800" height="360" fill="white"/><text x="280" y="130" font-size="25" fill="#233848">先说清结论，再解释依据</text><rect x="280" y="152" width="730" height="45" fill="#f5f0e3"/><text x="296" y="181" font-size="16" fill="#775d29">现场提示 · 不朗读</text><text x="280" y="242" font-size="22" fill="#164d69">口播正文使用清晰字号与舒适行距。</text><rect x="278" y="262" width="520" height="40" fill="#e9f4ef"/><text x="284" y="290" font-size="22" font-weight="bold" fill="#0e6356">核心判断以字重和强调样式区分。</text><rect x="280" y="326" width="730" height="48" fill="#f0f4f7" stroke="#d6e0e7"/><text x="296" y="357" font-size="17" fill="#164d69">可选展开 · 紧跟对应口播段落</text><text x="280" y="413" font-size="22" fill="#164d69">随后继续下一论点。</text><text x="24" y="490" font-size="15" fill="#586a77">界面示意，非浏览器截图。点击查看可下载的 HTML 源文件。</text></g></svg>